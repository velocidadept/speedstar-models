name: WordPress Playground PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: WordPress/action-wp-playground-pr-preview@v3
        with:
          blueprint: |
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              "landingPage": "/",
              "preferredVersions": {
                "php": "8.3",
                "wp": "latest"
              },
              "features": {
                "networking": true
              },
              "siteOptions": {
                "blogname": "Speedstar Models Dev",
                "blogdescription": "Scale Model Studio",
                "ss_playground_seed": "1",
                "woocommerce_currency": "EUR",
                "woocommerce_currency_pos": "right_space",
                "woocommerce_price_decimal_sep": ",",
                "woocommerce_price_thousand_sep": ".",
                "woocommerce_price_num_decimals": "2",
                "woocommerce_default_country": "PT"
              },
              "steps": [
                {
                  "step": "installPlugin",
                  "pluginData": {
                    "resource": "wordpress.org/plugins",
                    "slug": "woocommerce"
                  },
                  "options": {
                    "activate": true
                  }
                },
                {
                  "step": "installTheme",
                  "themeData": {
                    "resource": "git:directory",
                    "url": "https://github.com/${{ github.repository }}.git",
                    "ref": "${{ github.event.pull_request.head.ref }}",
                    "path": "/"
                  },
                  "options": {
                    "activate": true
                  }
                },
                {
                  "step": "login",
                  "username": "admin"
                }
              ]
            }
          description-template: |
            ## 🏁 Speedstar Models Preview

            {{PLAYGROUND_BUTTON}}

            **Branch:** `{{PR_HEAD_REF}}` · **Theme:** `{{THEME_SLUG}}`
          github-token: ${{ secrets.GITHUB_TOKEN }}
